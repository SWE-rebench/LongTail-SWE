# Base images referenced by data/longtail_tasks.json and data/longtail_easy_tasks.json
# (install_config.base_image_name).
#
# Every entry is built locally as `<tag>` (no registry prefix); `parent` entries are
# built first. `scripts/build_base_images.py` reads this file.
#
# provenance:
#   exact         Dockerfile (and build args) are the ones used for the published image.
#   reconstructed Published image was not built from a file available to us; the Dockerfile
#                 is reconstructed from the recorded image configuration / build procedure.
#   alias         Same image content as another entry (plain retag).
#   pull          Upstream image retagged without modification.
# role: task (used by >=1 task) | parent (intermediate build stage).
