# Models and settings of the solver-judge-repair pipeline as reported in the paper
# (Section 5.1, Appendix A.7, Table 4). Endpoints and keys are not included.
# Prompts are in ../prompts (rendered by longtail/prompts.py).

auditor:
  model: Kimi K3
  temperature: 1.0
  top_p: 1.0
  reasoning_effort: high
  context_tokens: 1048576
  prompts:
    system: prompts/auditor/system.j2

judge:
  model: Kimi K3
  temperature: 1.0
  top_p: 1.0
  reasoning_effort: high
  context_tokens: 1048576
  prompts:
    system: prompts/worker/system.j2
    task: prompts/judge/task.j2
    retry: prompts/judge/retry.j2

repairer:
  model: Kimi K3
  temperature: 1.0
  top_p: 1.0
  reasoning_effort: high
  context_tokens: 1048576
  prompts:
    system: prompts/worker/system.j2
    task: prompts/repairer/task.j2
    retry: prompts/repairer/retry.j2

solver:
  prompts:
    system: prompts/solver/system.j2
    task: prompts/solver/task.j2
  # Solver attempts during test repair (Appendix A.7): Kimi K3 (configuration above),
  # GPT 5.6 Terra (high), GPT 5.6 Luna (xhigh), GPT 5.6 Sol (high).
  # Paper configuration labels: three declared attempts per task.
  # Observed original/rerun settings are in evaluation_runs.json; labels below are not
  # a claim of uniform runtime settings. DeepSeek requests record max, not high;
  # Qwen 3.6 statement reruns use 131072 context tokens instead of 262144.
  evaluation_models:
    - {model: Claude Opus 5.5, reasoning: high, context: 1M}
    - {model: GPT 5.6 Sol, reasoning: high, context: 1M}
    - {model: GPT 5.6 Luna, reasoning: xhigh, context: 1M}
    - {model: Kimi K3, reasoning: max, context: 262K}
    - {model: DeepSeek V4 Flash, reasoning: high, context: 1M}
    - {model: GLM-5.3-Flash, reasoning: max, context: 262K}
    - {model: Qwen 3.8 27B, reasoning: xhigh, context: 262K}
    - {model: Qwen 3.6 27B, reasoning: thinking, context: 262K}

loop:
  rounds_per_set: 5               # repair rounds are run in sets of five (Section 3.4)
  min_accepted_per_language: 30   # language-level stopping condition (Section 3.4)
  min_benchmark_tasks_per_language: 15   # Historical construction target, not guaranteed after exclusions

# Not reported in the paper; defaults of the original implementation:
implementation_defaults:
  judge_max_steps: 120
  repairer_max_steps: 180
  judge_extraction_attempts: 2          # initial attempt + 1 targeted retry
  repairer_validity_attempts_per_cycle: 3   # initial attempt + 2 retries after failed validation
